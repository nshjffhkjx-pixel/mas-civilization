<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAS - حضارتك الرقمية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Cairo', Arial;
        }
   .intro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex;
            align-items: center; justify-content: center;
            animation: hideIntro 2.5s forwards;
        }
   .intro-text {
            font-size: 4rem; color: #00d9ff; font-weight: 900;
            text-shadow: 0 0 30px #00d9ff;
        }
        @keyframes hideIntro {
            0%, 70% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }
   .video-bg {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover; filter: brightness(0.65);
        }
   .overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }
   .content {
            position: relative; z-index: 2; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; color: #fff; padding: 20px;
            opacity: 0; animation: showContent 1s 2s forwards;
        }
        @keyframes showContent { to { opacity: 1; } }
   .title {
            font-size: 4rem; font-weight: 900;
            text-shadow: 0 0 15px #00d9ff;
            margin-bottom: 15px;
        }
   .subtitle {
            font-size: 1.5rem; opacity: 0.9;
            text-shadow: 0 0 8px #000; max-width: 700px;
            margin-bottom: 40px;
        }
   .enter-btn {
            padding: 16px 50px; font-size: 1.2rem; font-weight: bold;
            background: rgba(0, 217, 255, 0.2); border: 2px solid #00d9ff;
            color: #00d9ff; border-radius: 8px; cursor: pointer;
            transition: 0.2s; text-decoration: none;
        }
   .enter-btn:hover {
            background: #00d9ff; color: #000;
            box-shadow: 0 0 25px #00d9ff;
        }
        @media (max-width: 768px) {
           .intro-text { font-size: 2.5rem; }
           .title { font-size: 2.5rem; }
           .subtitle { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="intro">
        <div class="intro-text">MAS 𓂀</div>
    </div>

    <video class="video-bg" autoplay muted loop playsinline>
        <source src="./بوابتك_الفرعونية.webm" type="video/webm">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title">حضارتك الرقمية MAS</h1>
        <p class="subtitle">حيث يلتقي مجد الفراعنة بتقنية المستقبل</p>
        <a href="#" class="enter-btn">ادخل البوابة</a>
    </div>
</body>
</html>
